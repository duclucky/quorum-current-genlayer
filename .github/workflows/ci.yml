name: Verify contract and product
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m venv .venv
      - run: ./.venv/Scripts/python.exe -m pip install -r requirements.lock
      - run: npm ci
      - run: npm run check
        env:
          PYTHONUTF8: '1'
